openapi: 3.1.0
info:
  title: Jira Clone MVP — Project access and issues
  version: 0.1.0
  summary: Server-rendered project dashboard, lifecycle, assignments and issue operations.
  description: |
    The application is server-rendered (Thymeleaf + htmx). These operations are
    the same HTTP endpoints the browser uses: requests are HTML form posts or
    query strings, and responses are HTML pages or htmx fragments, not JSON.
    There is deliberately no separate JSON API (see `AGENTS.md`).

    Behaviour is owned by `specs/issues-spec.md`, `specs/projects-spec.md` and
    `specs/project-access-spec.md`. Authentication rules are in
    `specs/authentication-spec.md`. Non-members receive 404 on project-scoped
    routes; members receive 403 on owner-only mutations. Posts require CSRF.

    **htmx:** fragment-capable requests with `HX-Request: true` return the
    affected fragment; deletion and project editing use `HX-Redirect` instead
    of a 302. A normal request receives the full page or a redirect.
servers:
  - url: http://localhost:8080
    description: Local (docker compose)
security:
  - sessionCookie: []
tags:
  - name: Issues
    description: Issues and assignees in a project.
  - name: Projects
    description: Accessible projects and owner-only lifecycle.

paths:
  /:
    get:
      tags: [Projects]
      summary: Dashboard for the current user, with accessible projects and per-status issue counts
      responses:
        '200':
          description: HTML dashboard (including empty state when no projects are accessible).
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '401':
          $ref: '#/components/responses/HtmxUnauthenticated'

  /projects:
    get:
      tags: [Projects]
      summary: List owned or assigned-to projects, sorted by key, 25 per page
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of project name; blank means all accessible projects.
          schema:
            type: string
        - name: page
          in: query
          description: 1-based page number; pages past the end are empty.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: HTML project list or empty state.
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '401':
          $ref: '#/components/responses/HtmxUnauthenticated'
        '422':
          description: Non-numeric or less-than-one page; HTML list with error.
    post:
      tags: [Projects]
      summary: Create a project owned by the current user
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  type: string
                  pattern: '^[A-Z]{2,10}$'
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                  maxLength: 1000
      responses:
        '302':
          description: Redirect to `/projects/{key}` (which redirects to the issue list).
        '401':
          $ref: '#/components/responses/HtmxUnauthenticated'
        '403':
          description: Missing or invalid CSRF token.
        '422':
          description: Invalid key, name or description, or key already in use; HTML form with errors.

  /projects/{projectKey}/edit:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [Projects]
      summary: Owner-only project edit form
      responses:
        '200':
          description: HTML edit form.
        '403':
          description: Member is not the owner.
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectKey}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [Projects]
      summary: Owner-only name/description update; key remains immutable
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/HxRequest'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                description:
                  type: string
                  maxLength: 1000
      responses:
        '302':
          description: Redirect to project (normal request).
        '200':
          description: HX-Redirect to project (htmx request).
        '403':
          description: Member or invalid CSRF token.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation failed; HTML edit form with errors.

  /projects/{projectKey}/delete:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [Projects]
      summary: Owner-only project deletion confirmation
      responses:
        '200':
          description: HTML confirmation page.
        '403':
          description: Member is not the owner.
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Projects]
      summary: Delete project and dependent data atomically (owner only)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/HxRequest'
      responses:
        '302':
          description: Redirect to `/projects` (normal request).
        '200':
          description: HX-Redirect to `/projects` (htmx request).
        '403':
          description: Member or invalid CSRF token.
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectKey}/issues/{number}/delete:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/IssueNumber'
    get:
      tags: [Issues]
      summary: Owner-only issue deletion confirmation
      responses:
        '200':
          description: HTML confirmation page.
        '403':
          description: Member is not the owner.
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Issues]
      summary: Delete issue and dependent rows (owner only)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/HxRequest'
      responses:
        '302':
          description: Redirect to project issue list (normal request).
        '200':
          description: HX-Redirect to project issue list (htmx request).
        '403':
          description: Member or invalid CSRF token.
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectKey}/issues/{number}/assignees:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/IssueNumber'
      - $ref: '#/components/parameters/HxRequest'
    get:
      tags: [Issues]
      summary: Owner-only current assignees and eligible users
      responses:
        '200':
          description: HTML page or assignee fragment for htmx.
        '403':
          description: Member is not the owner.
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Issues]
      summary: Add one assignee (owner only)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  pattern: '^[0-9]+$'
      responses:
        '302':
          description: Redirect to issue detail (normal request).
        '200':
          description: Updated assignee fragment (htmx request).
        '403':
          description: Member or invalid CSRF token.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Duplicate, unknown or invalid user id; HTML form with error.

  /projects/{projectKey}/issues/{number}/assignees/{userId}/delete:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/IssueNumber'
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Issues]
      summary: Remove one assignee (owner only)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/HxRequest'
      responses:
        '302':
          description: Redirect to issue detail (normal request).
        '200':
          description: Updated assignee fragment (htmx request).
        '403':
          description: Member or invalid CSRF token.
        '404':
          description: Inaccessible project, missing issue or missing assignment.

  /projects/{projectKey}/issues:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/HxRequest'

    get:
      tags: [Issues]
      operationId: listIssues
      summary: List a project's issues with filters, search and paging
      description: |
        Returns the project's issues, newest number first, 25 per page (ISS-9).
        Filters combine with AND (ISS-10); `q` is combined with filters by AND
        (ISS-11). A missing filter means no restriction. An invalid filter value
        is rejected, never ignored (ISS-12). An inaccessible or unknown project returns `404`
        before any parameter is validated.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IssueType'
        - name: assignee
          in: query
          required: false
          description: User id, or `none` for unassigned issues.
          schema:
            oneOf:
              - type: string
                pattern: '^[0-9]+$'
              - type: string
                const: none
          examples:
            user:
              value: '42'
            unassigned:
              value: none
        - name: q
          in: query
          required: false
          description: Case-insensitive substring matched against the title or the issue key (e.g. `PROJ-7`). Blank means no restriction.
          schema:
            type: string
            maxLength: 200
          example: login
        - name: page
          in: query
          required: false
          description: 1-based page number. A page past the end returns an empty list (ISS-13).
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: |
            Full list page, or only the list fragment when `HX-Request: true`
            (ISS-14). The rendered page contains the items described by
            `IssueListPage`.
          content:
            text/html:
              schema:
                type: string
                contentMediaType: text/html
                x-view-model:
                  $ref: '#/components/schemas/IssueListPage'
              example: |
                <table id="issue-list">
                  <tr><td><a href="/projects/PROJ/issues/7">PROJ-7</a></td><td>Login fails</td><td>BUG</td><td>HIGH</td><td>To Do</td><td>Alice</td></tr>
                </table>
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '401':
          $ref: '#/components/responses/HtmxUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid `status`, `type`, `assignee` or `page`. No list is returned.
          content:
            text/html:
              schema:
                type: string
                x-view-model:
                  $ref: '#/components/schemas/ValidationErrors'

    post:
      tags: [Issues]
      operationId: createIssue
      summary: Create an issue
      description: |
        Creates an issue with status `TO_DO`, the current user as reporter, and
        the next number in the project (ISS-1). Concurrent creates receive
        distinct consecutive numbers (ISS-5). A rejected create consumes no
        number (ISS-3). Only the owner may create; an inaccessible or unknown
        project returns `404` before validation.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateIssueForm'
            example:
              title: Login fails with uppercase username
              description: Steps to reproduce...
              type: BUG
              priority: HIGH
              _csrf: 3f1c9e2a-...
      responses:
        '302':
          description: Created. Redirects to the new issue's detail page.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
              example: /projects/PROJ/issues/8
        '401':
          $ref: '#/components/responses/HtmxUnauthenticated'
        '403':
          description: Member is not the owner, or missing/invalid CSRF token. Nothing is created.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Validation failed (ISS-3, ISS-4). The create form is re-rendered
            with field errors and the submitted values; nothing is created.
          content:
            text/html:
              schema:
                type: string
                x-view-model:
                  $ref: '#/components/schemas/ValidationErrors'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server session created by form login at `POST /login`.

  parameters:
    ProjectKey:
      name: projectKey
      in: path
      required: true
      description: Project key.
      schema:
        type: string
        pattern: '^[A-Z]{2,10}$'
      example: PROJ
    IssueNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    HxRequest:
      name: HX-Request
      in: header
      required: false
      description: Sent by htmx. When `true`, the response is a fragment instead of a full page.
      schema:
        type: string
        enum: ['true']
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: false
      description: CSRF token sent by htmx. Plain form posts send `_csrf` in the body instead. One of the two is required.
      schema:
        type: string

  responses:
    LoginRedirect:
      description: Not logged in (normal browser request). Redirects to the login page; no data is returned.
      headers:
        Location:
          required: true
          schema:
            type: string
          example: /login
    HtmxUnauthenticated:
      description: Not logged in (htmx request). No data is returned; htmx navigates to the login page.
      headers:
        HX-Redirect:
          required: true
          schema:
            type: string
            const: /login
    NotFound:
      description: Unknown or inaccessible project key or issue. Nothing is disclosed about other projects.
      content:
        text/html:
          schema:
            type: string

  schemas:
    IssueType:
      type: string
      enum: [TASK, BUG, STORY]
    IssuePriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    IssueStatus:
      type: string
      enum: [TO_DO, IN_PROGRESS, DONE]

    CreateIssueForm:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation; blank is rejected.
        description:
          type: string
          maxLength: 5000
          description: Plain text, HTML-escaped when shown.
        type:
          $ref: '#/components/schemas/IssueType'
          default: TASK
        priority:
          $ref: '#/components/schemas/IssuePriority'
          default: MEDIUM
        _csrf:
          type: string
          description: CSRF token for plain form posts.
      additionalProperties: false

    IssueSummary:
      type: object
      description: One row of the issue list.
      required: [key, number, title, type, priority, status]
      properties:
        key:
          type: string
          example: PROJ-7
        number:
          type: integer
          minimum: 1
        title:
          type: string
        type:
          $ref: '#/components/schemas/IssueType'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        status:
          $ref: '#/components/schemas/IssueStatus'
        assignees:
          type: array
          description: Display names of all assigned users; empty when unassigned.
          items:
            type: string

    IssueListPage:
      type: object
      description: Data rendered by the list page (documentation of the HTML content).
      required: [items, page, pageSize, hasNext]
      properties:
        items:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/IssueSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          const: 25
        hasNext:
          type: boolean

    ValidationErrors:
      type: object
      description: Field errors rendered next to the form fields or filters.
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: title
              message:
                type: string
                example: Title is required
