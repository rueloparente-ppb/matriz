<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${project.key} + ' board'">Board</title></head>
<body>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0" th:text="${project.key} + ' · ' + ${project.name}">PROJ · Name</h1>
    <div>
      <a class="btn btn-outline-secondary" th:href="@{/projects/{key}/issues(key=${project.key})}">List</a>
      <a class="btn btn-primary" th:href="@{/projects/{key}/issues/new(key=${project.key})}">New issue</a>
    </div>
  </div>
  <div id="board" th:fragment="board">
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Move rejected</div>
    <form method="get" th:action="@{/projects/{key}/board(key=${project.key})}" class="mb-3 board-filter">
      <label for="board-sprint">Sprint</label>
      <select id="board-sprint" name="sprint" class="form-select" onchange="this.form.requestSubmit()">
        <option value="" th:selected="${sprintFilter == ''}">All</option>
        <option value="none" th:selected="${sprintFilter == 'none'}">No sprint</option>
        <option th:each="sprint : ${sprints}" th:value="${sprint.id}" th:text="${sprint.name}" th:selected="${sprintFilter == sprint.id.toString()}">Sprint</option>
      </select>
      <button type="submit" class="btn btn-outline-secondary btn-sm">Filter</button>
    </form>
    <div class="row g-3">
      <section class="col-md-4 board-lane" th:each="s : ${statuses}">
        <h2 class="h6" th:text="${s.name() == 'TO_DO' ? 'To Do' : (s.name() == 'DONE' ? 'Done' : 'In Progress')} + ' (' + ${#lists.size(columns.get(s))} + ')'">To Do</h2>
        <div class="board-column border rounded p-2 d-grid gap-2 align-content-start h-100"
             th:attr="data-status=${s}">
          <article class="card p-2" th:each="card : ${columns.get(s)}" th:attr="data-issue=${card.issue.number}">
            <div><a th:href="@{/projects/{key}/issues/{n}(key=${project.key},n=${card.issue.number})}"
                    th:text="${project.key} + '-' + ${card.issue.number}">PROJ-1</a>
              <span th:text="${card.issue.title}">Title</span></div>
            <div class="board-card-meta"><span class="badge" th:attr="data-value=${card.issue.type}" th:text="${card.issue.type}">TASK</span>
              <span class="badge" th:attr="data-value=${card.issue.priority}" th:text="${card.issue.priority}">MEDIUM</span>
              <small class="text-muted" th:text="${card.assignee}">Assignee</small></div>
          </article>
        </div>
      </section>
    </div>
  </div>
  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
      const url = /*[[@{/projects/{key}/board/move(key=${project.key})}]]*/ '';
      const init = root => root.querySelectorAll('.board-column').forEach(column => {
        if (column.sortable) return;
        column.sortable = new Sortable(column, {
          group: 'board', animation: 150,
          onEnd: event => {
            event.item.remove();
            event.from.insertBefore(event.item, event.from.children[event.oldIndex] || null);
            if (event.from === event.to) return;
            htmx.ajax('POST', url, {
              target: '#board', swap: 'outerHTML',
              values: {issue: event.item.dataset.issue, status: event.to.dataset.status,
                ...(document.querySelector('#board-sprint').value && {sprint: document.querySelector('#board-sprint').value})},
              headers: JSON.parse(document.body.getAttribute('hx-headers'))
            });
          }
        });
      });
      init(document.body);
      htmx.onLoad(init);
    });
  </script>
</main>
</body>
</html>
