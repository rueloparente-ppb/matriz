<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Register</title></head>
<body>
<main class="container py-5 login-panel">
  <h1 class="h3 mb-3">Register</h1>
  <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" autocomplete="username" autofocus>
      <div class="invalid-feedback" th:errors="*{username}">Username error</div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" name="password" type="password" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
      <div class="invalid-feedback" th:errors="*{password}">Password error</div>
    </div>
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" autocomplete="new-password">
      <div class="invalid-feedback" th:errors="*{confirmPassword}">Confirmation error</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
  <p class="mt-3">Already have an account? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
