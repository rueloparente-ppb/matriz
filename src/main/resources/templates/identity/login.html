<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Log in</title></head>
<body>
<main class="container py-5" style="max-width: 400px">
  <h1 class="h3 mb-3">Log in</h1>
  <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
  <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" name="username" class="form-control" autocomplete="username" autofocus required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Log in</button>
  </form>
</main>
</body>
</html>
