<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Projects</title></head>
<body>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Projects</h1>
    <a class="btn btn-primary" th:href="@{/projects/new}">New project</a>
  </div>
  <form method="get" th:action="@{/projects}" class="mb-3 d-flex gap-2">
    <input name="q" type="search" class="form-control" aria-label="Search projects by name" placeholder="Search projects" th:value="${q}">
    <button type="submit" class="btn btn-outline-primary">Search</button>
  </form>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Invalid page</div>
  <p th:if="${error == null and #lists.isEmpty(projects)}" class="empty-state">No projects found.</p>
  <table class="table" th:if="${error == null and !#lists.isEmpty(projects)}">
    <thead><tr><th>Key</th><th>Name</th></tr></thead>
    <tbody>
      <tr th:each="p : ${projects}">
        <td><a th:href="@{/projects/{key}(key=${p.key})}" th:text="${p.key}">PROJ</a></td>
        <td th:text="${p.name}">Name</td>
      </tr>
    </tbody>
  </table>
  <nav th:if="${error == null and totalPages > 1}" aria-label="Pages" class="d-flex gap-3 align-items-center">
    <a th:if="${page > 1}" th:href="@{/projects(q=${q},page=${page - 1})}">Previous</a>
    <span th:text="'Page ' + ${page} + ' of ' + ${totalPages}">Page 1 of 2</span>
    <a th:if="${page < totalPages}" th:href="@{/projects(q=${q},page=${page + 1})}">Next</a>
  </nav>
</main>
</body>
</html>
