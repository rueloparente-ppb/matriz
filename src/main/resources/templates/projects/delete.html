<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Delete project</title></head>
<body><main class="container py-4">
  <h1 class="h3">Delete project <span th:text="${project.key}">PROJ</span> · <span th:text="${project.name}">Name</span>?</h1>
  <p>This permanently removes the project, its issues, comments, history, sprints, sprint memberships and assignments.</p>
  <form method="post" th:action="@{/projects/{key}/delete(key=${project.key})}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-danger" type="submit">Delete project</button>
    <a class="btn btn-link" th:href="@{/projects/{key}(key=${project.key})}">Cancel</a>
  </form>
</main></body></html>
