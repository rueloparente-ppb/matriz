<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>New project</title></head>
<body>
<main class="container py-4" style="max-width: 500px">
  <h1 class="h3 mb-3">New project</h1>
  <form th:action="@{/projects}" th:object="${form}" method="post" novalidate>
    <div class="mb-3">
      <label for="key" class="form-label">Key</label>
      <input id="key" th:field="*{key}" class="form-control" th:classappend="${#fields.hasErrors('key')} ? 'is-invalid'" autofocus>
      <div class="invalid-feedback" th:errors="*{key}">Key error</div>
    </div>
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input id="name" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{name}">Name error</div>
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
    <a class="btn btn-link" th:href="@{/projects}">Cancel</a>
  </form>
</main>
</body>
</html>
