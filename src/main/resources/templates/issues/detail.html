<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${issue.key} + ' ' + ${issue.title}">Issue</title></head>
<body>
<main class="container py-4">
  <div th:replace="~{issues/nav :: nav(${project})}"></div>
  <h2 class="h4" th:text="${issue.key}">PROJ-1</h2>
  <div th:replace="~{issues/field :: view('title')}"></div>
  <div th:replace="~{issues/field :: view('description')}"></div>
  <dl class="row">
    <dt class="col-sm-2">Type</dt><dd class="col-sm-10"><div th:replace="~{issues/field :: view('type')}"></div></dd>
    <dt class="col-sm-2">Priority</dt><dd class="col-sm-10"><div th:replace="~{issues/field :: view('priority')}"></div></dd>
    <dt class="col-sm-2">Status</dt><dd class="col-sm-10"><div th:replace="~{issues/field :: view('status')}"></div></dd>
    <dt class="col-sm-2">Assignees</dt><dd class="col-sm-10"><div th:if="${projectRole == 'OWNER'}" th:replace="~{issues/assignees :: assignees}"></div><span th:unless="${projectRole == 'OWNER'}" th:text="${issue.assigneeName}">Unassigned</span></dd>
    <dt class="col-sm-2">Reporter</dt><dd class="col-sm-10" th:text="${issue.reporterName}">Alice</dd>
    <dt class="col-sm-2">Created</dt><dd class="col-sm-10" th:text="${issue.createdAt}">2026-01-01</dd>
    <dt class="col-sm-2">Updated</dt><dd class="col-sm-10" th:text="${issue.updatedAt}">2026-01-01</dd>
  </dl>
  <a th:if="${projectRole == 'OWNER'}" class="btn btn-outline-danger"
     th:href="@{/projects/{key}/issues/{number}/delete(key=${project.key},number=${issue.number})}">Delete issue</a>
  <div th:hx-get="@{/projects/{key}/issues/{number}/sprint(key=${project.key},number=${issue.number})}"
       hx-trigger="load" hx-swap="outerHTML">Loading sprint…</div>
  <div th:hx-get="@{/projects/{key}/issues/{number}/comments(key=${project.key},number=${issue.number})}"
       hx-trigger="load" hx-swap="outerHTML">Loading comments…</div>
  <div th:hx-get="@{/projects/{key}/issues/{number}/history(key=${project.key},number=${issue.number})}"
       hx-trigger="load" hx-swap="outerHTML">Loading history…</div>
</main>
</body>
</html>
