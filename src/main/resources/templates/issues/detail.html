<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${issue.key} + ' ' + ${issue.title}">Issue</title></head>
<body>
<main class="container py-4">
  <div th:replace="~{issues/nav :: nav(${project})}"></div>
  <h2 class="h4" th:text="${issue.key}">PROJ-1</h2>
  <div th:replace="~{issues/field :: view('title')}"></div>
  <div th:replace="~{issues/field :: view('description')}"></div>
  <dl class="row">
    <dt class="col-sm-2">Type</dt><dd class="col-sm-10"><div th:replace="~{issues/field :: view('type')}"></div></dd>
    <dt class="col-sm-2">Priority</dt><dd class="col-sm-10"><div th:replace="~{issues/field :: view('priority')}"></div></dd>
    <dt class="col-sm-2">Status</dt><dd class="col-sm-10"><div th:replace="~{issues/field :: view('status')}"></div></dd>
    <dt class="col-sm-2">Assignee</dt><dd class="col-sm-10"><div th:replace="~{issues/field :: view('assignee')}"></div></dd>
    <dt class="col-sm-2">Reporter</dt><dd class="col-sm-10" th:text="${issue.reporterName}">Alice</dd>
    <dt class="col-sm-2">Created</dt><dd class="col-sm-10" th:text="${issue.createdAt}">2026-01-01</dd>
    <dt class="col-sm-2">Updated</dt><dd class="col-sm-10" th:text="${issue.updatedAt}">2026-01-01</dd>
  </dl>
</main>
</body>
</html>
