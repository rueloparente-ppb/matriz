<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${issue.key} + ' ' + ${issue.title}">Issue</title></head>
<body>
<main class="container py-4">
  <div th:replace="~{issues/nav :: nav(${project})}"></div>
  <h2 class="h4"><span th:text="${issue.key}">PROJ-1</span>: <span th:text="${issue.title}">Title</span></h2>
  <p style="white-space: pre-wrap" th:text="${issue.description}">Description</p>
  <dl class="row">
    <dt class="col-sm-2">Type</dt><dd class="col-sm-10" th:text="${issue.type}">TASK</dd>
    <dt class="col-sm-2">Priority</dt><dd class="col-sm-10" th:text="${issue.priority}">MEDIUM</dd>
    <dt class="col-sm-2">Status</dt><dd class="col-sm-10" th:text="${issue.status}">TO_DO</dd>
    <dt class="col-sm-2">Assignee</dt><dd class="col-sm-10" th:text="${issue.assigneeName}">Unassigned</dd>
    <dt class="col-sm-2">Reporter</dt><dd class="col-sm-10" th:text="${issue.reporterName}">Alice</dd>
    <dt class="col-sm-2">Created</dt><dd class="col-sm-10" th:text="${issue.createdAt}">2026-01-01</dd>
    <dt class="col-sm-2">Updated</dt><dd class="col-sm-10" th:text="${issue.updatedAt}">2026-01-01</dd>
  </dl>
</main>
</body>
</html>
