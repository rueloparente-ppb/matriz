<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Delete issue</title></head>
<body><main class="container py-4">
  <h1 class="h3">Delete issue <span th:text="${issue.key}">PROJ-1</span> · <span th:text="${issue.title}">Title</span>?</h1>
  <p>This permanently removes the issue, its comments, history, assignments and sprint membership.</p>
  <form method="post" th:action="@{/projects/{key}/issues/{number}/delete(key=${project.key},number=${issue.number})}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-danger" type="submit">Delete issue</button>
    <a class="btn btn-link" th:href="@{/projects/{key}/issues/{number}(key=${project.key},number=${issue.number})}">Cancel</a>
  </form>
</main></body></html>
