services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jiraclone
      POSTGRES_USER: jiraclone
      POSTGRES_PASSWORD: jiraclone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraclone -d jiraclone"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: the app as a container. Run with `docker compose --profile app up --build`.
  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jiraclone
      DB_USERNAME: jiraclone
      DB_PASSWORD: jiraclone
    ports:
      - "8080:8080"

volumes:
  pgdata:
